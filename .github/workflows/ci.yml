name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 8.5

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: fileinfo, gd, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer stan

      - name: Check code style
        run: composer lint

      - name: Check Blade formatting
        run: npm run format:check

  deploy:
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    # The Forge deploy hook URL lives in each environment's FORGE_DEPLOY_HOOK secret.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Trigger Forge deployment
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_DEPLOY_HOOK }}
        run: |
          if [ -z "$FORGE_DEPLOY_HOOK" ]; then
            echo "::error::FORGE_DEPLOY_HOOK secret is not set for this environment."
            exit 1
          fi
          curl -fsS -X POST "$FORGE_DEPLOY_HOOK"
